# ======================================
# 凌越智缆 - 密钥配置文件
# 注意: 生产环境请妥善保管此文件
# ======================================

[general]
# 应用基本信息
app_name = "凌越智缆"
app_version = "2.1.0"
app_description = "高压电缆维护机器人智能运维平台"
company = "凌越科技"

[database]
# 数据库配置（示例）
# host = "localhost"
# port = 5432
# name = "lingyue_db"
# user = "admin"
# password = "your_password_here"

[api]
# API配置（示例）
# base_url = "https://api.lingyue.com"
# api_key = "your_api_key_here"
# timeout = 30

[auth]
# 认证配置
# jwt_secret = "your_jwt_secret_here"
# token_expiry = 3600

[monitoring]
# 监控配置
# enable_logging = true
# log_level = "INFO"
# metrics_enabled = true

[features]
# 功能开关
enable_realtime_monitoring = true
enable_alarm_notifications = true
enable_data_export = true
enable_device_management = true
enable_ice_monitoring = true
enable_gprs_tracking = true
enable_digital_twin = true
